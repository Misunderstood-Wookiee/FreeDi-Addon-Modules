[gcode_macro CLEAN_NOZZLE]
description: Wipe nozzle over configured brush path. Auto-homes if needed, heats nozzle if below threshold, and optionally powers down or re-homes after wipe based on print state.
# Summary:
# - Version: 1.2
# - Author: MoistDreams
# - Purpose: Performs a nozzle wipe pass over the configured brush path.
# - Behavior: Auto-homes first if needed, heats the nozzle if below the wipe threshold,
#   and optionally powers down or re-homes after the wipe based on print state.
# - Notes: Safe for use during startup and print-start flows; supports optional LABEL context
#   for caller-specific status messages. Verifies homing, heating, and wipe-start position
#   rather than assuming they succeeded, raising a clear error on mismatch.
#
# Developer notes:
# - Keep variable defaults in the header near the related behavior they affect.
# - Prefer state-aware cleanup so the macro does not disrupt an active or paused print.
# - Avoid adding new RESPOND messages here unless they clarify a distinct state change.
#
# Usage:
# - Run: CLEAN_NOZZLE
# - Example: CLEAN_NOZZLE LABEL="pre-calibration pass 1/2"
#   This appends the label to the RESPOND message, e.g. "CLEAN_NOZZLE: Wiping nozzle (4 passes) - pre-calibration pass 1/2"
# 
# - Tune behavior by editing variable_* values below.
# Wipe path coordinates
variable_begin_x: -8.5            # Begin wipe X position (mm). Suggested default: -8.5
variable_begin_y: 94.0            # Begin wipe Y position (mm). Suggested default: 94.0
variable_begin_z: 14.400          # Begin wipe Z height (mm). Suggested default: 14.400
variable_end_x: -8.5              # End wipe X position (mm). Suggested default: -8.5
variable_end_y: 78.0              # End wipe Y position (mm). Suggested default: 78.0
variable_end_z: 14.400            # End wipe Z height (mm). Suggested default: 14.400

# Temperature controls
variable_wipe_temp: 180           # Heat target if nozzle is too cold (degC). Suggested default: 180
variable_min_wipe_temp: 150       # Minimum actual nozzle temp before wiping (degC). Suggested default: 150

# Motion and clearance controls
variable_approach_speed: 15000    # Travel speed to approach wipe start (mm/min). Suggested default: 15000
variable_wipe_speed: 8000         # Swish speed during wipe strokes (mm/min). Suggested default: 8000
variable_safe_travel_z: 20.0      # Safe clearance Z before XY travel (mm). Suggested default: 20.0
variable_position_tolerance: 0.5  # How far (mm) the toolhead may sit from the commanded wipe-start point and still be trusted; catches skipped/stalled moves before wiping. Suggested default: 0.5

# Timing controls
variable_start_pause_ms: 50       # Pause after reaching wipe start (ms). Suggested default: 50
variable_wipe_pause_ms: 10        # Pause between wipe strokes (ms). Suggested default: 10

# Cycle count
variable_passes: 3                # Number of swish passes (Begin->End). Suggested default: 3

# Post-wipe cleanup options
variable_powerdown_after_wipe: 1  # 1=turn off hotend after wipe when no active/resumable print, 0=leave as-is
variable_home_after_wipe: 1       # 1=home after wipe when no active/resumable print, 0=skip homing
gcode:
  # Developer note: keep this alias to make variable access concise.
  {% set wipe = printer["gcode_macro CLEAN_NOZZLE"] %}
  {% set th = printer.toolhead %}
  {% set print_state = printer.print_stats.state|string|lower %}
  # Optional caller-supplied context (e.g. "pre-calibration pass 1/2") folded into
  # this macro's own wipe-start message so callers like PRINT_START don't need
  # a separate RESPOND before invoking CLEAN_NOZZLE.
  {% set label = params.LABEL|default("")|string %}

  # User protection: reject unsafe values before moving.
  {% if wipe.passes|int < 1 %}
      {action_raise_error("CLEAN_NOZZLE: 'passes' is set to %d, which is invalid. Fix: edit variable_passes to 1 or more."|format(wipe.passes|int))}
  {% endif %}
  {% if wipe.safe_travel_z < th.axis_minimum.z or wipe.safe_travel_z > th.axis_maximum.z %}
      {action_raise_error("CLEAN_NOZZLE: 'safe_travel_z' (%.2f) is outside this printer's Z travel range (%.2f to %.2f). Fix: edit variable_safe_travel_z to a value within range."|format(wipe.safe_travel_z, th.axis_minimum.z, th.axis_maximum.z))}
  {% endif %}
  {% if wipe.wipe_temp < wipe.min_wipe_temp %}
      {action_raise_error("CLEAN_NOZZLE: 'wipe_temp' (%.1fc) is lower than 'min_wipe_temp' (%.1fc), so the nozzle could never reach the required temperature. Fix: raise variable_wipe_temp or lower variable_min_wipe_temp."|format(wipe.wipe_temp, wipe.min_wipe_temp))}
  {% endif %}
  {% if wipe.approach_speed|float <= 0 or wipe.wipe_speed|float <= 0 %}
      {action_raise_error("CLEAN_NOZZLE: 'approach_speed' or 'wipe_speed' is 0 or negative, so the toolhead cannot move. Fix: set variable_approach_speed and variable_wipe_speed to positive values.")}
  {% endif %}
  {% if wipe.start_pause_ms|int < 0 or wipe.wipe_pause_ms|int < 0 %}
      {action_raise_error("CLEAN_NOZZLE: 'start_pause_ms' or 'wipe_pause_ms' is negative, which is invalid. Fix: set both to 0 or more.")}
  {% endif %}
  {% if wipe.powerdown_after_wipe|int not in [0, 1] or wipe.home_after_wipe|int not in [0, 1] %}
      {action_raise_error("CLEAN_NOZZLE: 'powerdown_after_wipe' or 'home_after_wipe' is set to something other than 0 or 1. Fix: set both to 0 (off) or 1 (on).")}
  {% endif %}
  {% if wipe.begin_x < th.axis_minimum.x or wipe.begin_x > th.axis_maximum.x or wipe.end_x < th.axis_minimum.x or wipe.end_x > th.axis_maximum.x or wipe.begin_y < th.axis_minimum.y or wipe.begin_y > th.axis_maximum.y or wipe.end_y < th.axis_minimum.y or wipe.end_y > th.axis_maximum.y or wipe.begin_z < th.axis_minimum.z or wipe.begin_z > th.axis_maximum.z or wipe.end_z < th.axis_minimum.z or wipe.end_z > th.axis_maximum.z %}
      {action_raise_error("CLEAN_NOZZLE: one or more wipe path coordinates (begin_x/y/z, end_x/y/z) fall outside this printer's travel limits, which would crash the toolhead. Fix: adjust the wipe path variables to stay within your printer's axis limits.")}
  {% endif %}
  {% if wipe.begin_z > wipe.safe_travel_z or wipe.end_z > wipe.safe_travel_z %}
      {action_raise_error("CLEAN_NOZZLE: 'begin_z' or 'end_z' is higher than 'safe_travel_z', so the 'safe' travel height would not actually clear the wipe height. Fix: raise variable_safe_travel_z above both variable_begin_z and variable_end_z.")}
  {% endif %}
  {% if wipe.position_tolerance|float <= 0 %}
      {action_raise_error("CLEAN_NOZZLE: 'position_tolerance' is 0 or negative, so the wipe-start position check can never pass. Fix: set variable_position_tolerance to a small positive value, e.g. 0.5.")}
  {% endif %}

  # Preserve caller movement/extrusion modes.
  SAVE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE
  {% if printer.toolhead.homed_axes != "xyz" %}
      M117 Homing before wipe
      RESPOND MSG="CLEAN_NOZZLE: Homing before wipe"
      G28
  {% endif %}
  # Confirm homing actually succeeded rather than assuming G28 left the axes homed.
  _CLEAN_NOZZLE_CHECK_HOMED
  G90

  # Ensure nozzle is warm enough to wipe effectively.
  {% if printer.extruder.temperature < wipe.min_wipe_temp %}
      M117 Heating hotend to wipe
      RESPOND MSG="CLEAN_NOZZLE: Heating hotend to {wipe.wipe_temp}c before wiping"
      M109 S{wipe.wipe_temp}
      # M109 should block until reached; verify rather than trust silently.
      _CLEAN_NOZZLE_CHECK_TEMP MIN={wipe.min_wipe_temp}
  {% endif %}

  M117 Wiping...
  RESPOND MSG="CLEAN_NOZZLE: Wiping nozzle ({wipe.passes} passes){% if label %} - {label}{% endif %}"
  # Safer approach: raise Z, move over brush, then drop to wipe height.
  G1 Z{wipe.safe_travel_z} F{wipe.approach_speed}
  G1 X{wipe.begin_x} Y{wipe.begin_y} F{wipe.approach_speed}
  G1 Z{wipe.begin_z} F{wipe.approach_speed}
  G4 P{wipe.start_pause_ms}
  # Flush the queue and re-check actual position before wiping so a skipped
  # move (stall, timeout, etc.) is caught instead of wiping in the wrong spot.
  M400
  _CLEAN_NOZZLE_CHECK_POSITION X={wipe.begin_x} Y={wipe.begin_y} Z={wipe.begin_z} TOLERANCE={wipe.position_tolerance}

  # Swish motion: Begin -> End, repeat for variable_passes.
  {% for _ in range(wipe.passes|int) %}
      G1 X{wipe.end_x} Y{wipe.end_y} Z{wipe.end_z} F{wipe.wipe_speed}
      G4 P{wipe.wipe_pause_ms}
      {% if not loop.last %}
          G1 X{wipe.begin_x} Y{wipe.begin_y} Z{wipe.begin_z} F{wipe.wipe_speed}
          G4 P{wipe.wipe_pause_ms}
      {% endif %}
  {% endfor %}

  # Post-wipe cleanup only when no job is in progress.
  # Treat paused as in-progress to avoid disrupting a resumable print.
  {% if print_state not in ["printing", "paused"] %}
      {% if wipe.powerdown_after_wipe|int == 1 %}
          # Extruder off
          M104 S0
      {% endif %}
      {% if wipe.home_after_wipe|int == 1 %}
          # Return home
          M117 Homing after wipe
          RESPOND MSG="CLEAN_NOZZLE: No print in progress, re-homing after wipe"
          G28
          _CLEAN_NOZZLE_CHECK_HOMED
      {% endif %}
  {% endif %}

  M117 Nozzle Cleaned
  RESPOND MSG="CLEAN_NOZZLE: Wipe complete"
  RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE

[gcode_macro _CLEAN_NOZZLE_CHECK_HOMED]
description: Internal helper - confirms all axes are homed after a G28 call.
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
      {action_raise_error("CLEAN_NOZZLE: homing did not complete (homed axes: '%s'), likely due to a missed endstop trigger or an aborted G28. Fix: check the endstops/wiring and re-run CLEAN_NOZZLE or G28 manually."|format(printer.toolhead.homed_axes))}
  {% endif %}

[gcode_macro _CLEAN_NOZZLE_CHECK_TEMP]
description: Internal helper - confirms the extruder actually reached the required temperature.
gcode:
  {% set min_temp = params.MIN|float %}
  {% if printer.extruder.temperature < min_temp %}
      {action_raise_error("CLEAN_NOZZLE: extruder is at %.1fc, below the %.1fc required to wipe, so M109 did not finish as expected. Fix: check the heater/thermistor and retry; lower variable_min_wipe_temp only if your brush material can tolerate it."|format(printer.extruder.temperature, min_temp))}
  {% endif %}

[gcode_macro _CLEAN_NOZZLE_CHECK_POSITION]
description: Internal helper - confirms the toolhead reached the expected wipe-start position (call after M400).
gcode:
  {% set pos = printer.toolhead.position %}
  {% set exp_x = params.X|float %}
  {% set exp_y = params.Y|float %}
  {% set exp_z = params.Z|float %}
  {% set tol = params.TOLERANCE|float %}
  {% if (pos.x - exp_x)|abs > tol or (pos.y - exp_y)|abs > tol or (pos.z - exp_z)|abs > tol %}
      {action_raise_error("CLEAN_NOZZLE: toolhead is at X%.2f Y%.2f Z%.2f but expected X%.2f Y%.2f Z%.2f (tolerance %.2fmm), suggesting a skipped step or stalled move. Fix: check for mechanical binding/skipped steps, then re-run CLEAN_NOZZLE; raise variable_position_tolerance if moves are simply less precise than expected."|format(pos.x, pos.y, pos.z, exp_x, exp_y, exp_z, tol))}
  {% endif %}