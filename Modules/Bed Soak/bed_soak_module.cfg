# ============================================================
# Module: Bed Soak
# Macro: BED_SOAK
# Author: MoistDreams + AI Assistant
# Version: 1.5.2
# Last Updated: 2026-08-09
# Description:
#   This macro implements an adaptive bed soak routine for 3D printing.
#   It waits for the heated bed to reach a target temperature floor and then
#   holds it for a material-specific soak duration to ensure thermal stability.
#   The soak duration is resolved from a canonical material timing map with
#   temperature-based fallback for unknown materials.
#   This is particularly useful for materials that benefit from a stable bed temperature
#   before starting the print, such as ABS, PETG, and other high-temperature filaments.
#
# Expected Params which should be passed from slicer or manually:
#   MATERIAL=<string>        Example: PLA, PLA+, TPU AIR, PEBA, PETG-CF, ABS
#   BED_TEMP=<int>           Preferred explicit soak target temperature in C
#   bed_target_temp=<int>    Optional soak target alias for start macro compatibility
#   FORCE_SOAK=<bool-string> True/False, forces soak when True
#
# Developer Notes:
#   - Keep this macro side-effect free except status messages and wait.
#   - Preserve defaults to avoid slicer compatibility regressions.
#   - Soak temperature resolution order: BED_TEMP -> bed_target_temp -> heater_bed.target -> 60C.
#   - Waiting uses a minimum-threshold check (no upper clamp) to avoid oscillation stalls.
#   - Material matching uses canonical families plus alias buckets for maintainability.
#   - TPU_AIR alias pass intentionally overrides generic TPU/TPE classification.
#   - Unknown materials fall back to soak timing derived from the resolved bed temperature.
#   - Macro execution is blocking while soak is active; queued console commands run afterward.
# ============================================================

[gcode_macro BED_SOAK]
description: Wait for bed to thermally stabilize based on material type
gcode:
    # Input parsing: normalize common slicer inputs and apply safe defaults.
    # Resolve soak temperature from explicit params first, then current heater target.
    {% set raw_material = params.MATERIAL|default("PLA")|upper %}
    {% set bed_soak_temp = params.BED_TEMP|default(params.BED_TARGET_TEMP|default(printer.heater_bed.target|default(60)))|int %}
    
    # DEBUG: Uncomment to see what's being passed
    # RESPOND TYPE=command MSG="DEBUG: MATERIAL={raw_material}, BED_SOAK_TEMP={bed_soak_temp}"
    
    # If bed_soak_temp is 0 or less, something is wrong - use safe default
    {% if bed_soak_temp <= 0 %}
        {% set bed_soak_temp = 60 %}
        RESPOND TYPE=command MSG="WARNING: Invalid soak temperature, using 60°C"
    {% endif %}
    
    # FORCE_SOAK is string-based in macro params, normalize to a strict boolean.
    {% set force_soak = params.FORCE_SOAK|default("False")|lower == "true" %}
    {% set is_abrasive = "-CF" in raw_material or "_CF" in raw_material or " CF" in raw_material or "CARBON" in raw_material or "-GF" in raw_material or "_GF" in raw_material or " GF" in raw_material or "GLASS" in raw_material %}
    
    # Material normalization maps families/variants to a canonical key.
    # Keep alias buckets in one place so future additions only touch list entries.
    {% set material = raw_material %}
    {% set nylon_aliases = ["PA-CF", "PA/GF", "PA-GF", " ULTRAPA", "COPA"] %}
    {% set tpu_air_aliases = ["TPU AIR", "TPU-AIR", "LW-TPU", "LIGHTWEIGHT TPU", "FOAMING TPU", "TPU-AERO", "AERO TPU", "TPU FOAMY", "FOAMY TPU"] %}

    {% if "PPA" in raw_material %}
        {% set material = "PPA" %}
    {% elif "PAHT" in raw_material %}
        {% set material = "PAHT" %}
    {% elif "PA12" in raw_material %}
        {% set material = "PA12" %}
    {% elif "PA11" in raw_material %}
        {% set material = "PA11" %}
    {% elif "PA6" in raw_material or "PA66" in raw_material %}
        {% set material = "PA6" %}
    {% elif "POLYCARBONATE" in raw_material or raw_material == "PC" or "PC-" in raw_material or "PC/" in raw_material or "PC+" in raw_material or "PC " in raw_material %}
        {% set material = "PC" %}
    {% elif "PCTG" in raw_material %}
        {% set material = "PCTG" %}
    {% elif "PETG" in raw_material %}
        {% set material = "PETG" %}
    {% elif raw_material == "PET" or "PET-" in raw_material or "PET " in raw_material %}
        {% set material = "PET" %}
    {% elif raw_material == "PP" or "PP-" in raw_material or raw_material.startswith("PP ") or raw_material.startswith("PP+") %}
        {% set material = "PP" %}
    {% elif "PPS" in raw_material %}
        {% set material = "PPS" %}
    {% elif "NYLON" in raw_material or "POLYAMIDE" in raw_material or raw_material.startswith("PA ") or raw_material == "PA" or raw_material.startswith("PA-") or raw_material.startswith("PA/") or raw_material.startswith("ULTRAPA") %}
        {% set material = "NYLON" %}
    {% elif "PEBA" in raw_material or "PEBAX" in raw_material %}
        {% set material = "PEBA" %}
    {% elif "SUPPORT FOR PLA-PETG" in raw_material or "SUPPORT FOR PLA/PETG" in raw_material %}
        {% set material = "PETG" %}
    {% elif "SUPPORT FOR PA PET" in raw_material or "SUPPORT FOR PET-PA" in raw_material or "SUPPORT FOR PET/PA" in raw_material %}
        {% set material = "NYLON" %}
    {% elif "PLA" in raw_material %}
        {% set material = "PLA" %}
    {% elif "TPU" in raw_material or "TPE" in raw_material %}
        {% set material = "TPU" %}
    {% elif "PVA" in raw_material or "BVOH" in raw_material %}
        {% set material = "PVA" %}
    {% elif "HIPS" in raw_material %}
        {% set material = "HIPS" %}
    {% elif "ABS" in raw_material %}
        {% set material = "ABS" %}
    {% elif "ASA" in raw_material %}
        {% set material = "ASA" %}
    {% endif %}

    # Secondary alias buckets handled after core families.
    {% if material == raw_material %}
        {% for alias in nylon_aliases %}
            {% if alias in raw_material %}
                {% set material = "NYLON" %}
            {% endif %}
        {% endfor %}
    {% endif %}

    # TPU_AIR aliases should override generic TPU/TPE matching.
    {% for alias in tpu_air_aliases %}
        {% if alias in raw_material %}
            {% set material = "TPU_AIR" %}
        {% endif %}
    {% endfor %}
    
    # Decision rule: soak for high-temp jobs, listed materials, or explicit FORCE_SOAK.
    # Determine if soak is needed from the resolved soak temperature or material.
    {% set high_temp_materials = ["PETG", "PCTG", "PET", "ABS", "ASA", "HIPS", "PP", "PC", "PPA", "PPS", "NYLON", "PA6", "PA11", "PA12", "PAHT", "PEBA"] %}
    {% set needs_soak = force_soak or bed_soak_temp >= 70 or material in high_temp_materials %}

    # Emit a concise decision message so "blocking" behavior is obvious in logs.
    {% if needs_soak %}
        RESPOND TYPE=command MSG="BED_SOAK active: material={raw_material}, target={bed_soak_temp}°C, force={force_soak}"
    {% else %}
        RESPOND TYPE=command MSG="BED_SOAK skipped: material={raw_material}, target={bed_soak_temp}°C, force={force_soak}"
    {% endif %}
    
    # --- SOAK LOGIC (wrapped in conditional) ---
    {% if needs_soak %}
    
        # Define soak times by canonical material mapping.
        {% set soak_time_map = {
            "TPU_AIR": 60000,   # 1.0 min
            "PLA": 90000,       # 1.5 min
            "TPU": 90000,       # 1.5 min
            "PVA": 90000,       # 1.5 min
            "PETG": 120000,     # 2.0 min
            "PEBA": 120000,     # 2.0 min
            "PCTG": 150000,     # 2.5 min
            "PET": 150000,      # 2.5 min
            "HIPS": 180000,     # 3.0 min
            "ABS": 210000,      # 3.5 min
            "ASA": 210000,      # 3.5 min
            "PP": 240000,       # 4.0 min
            "PC": 300000,       # 5.0 min
            "PPA": 300000,      # 5.0 min
            "PPS": 300000,      # 5.0 min
            "NYLON": 300000,    # 5.0 min
            "PA6": 300000,      # 5.0 min
            "PA11": 300000,     # 5.0 min
            "PA12": 300000,     # 5.0 min
            "PAHT": 300000      # 5.0 min
        } %}

        {% if material in soak_time_map %}
            {% set soak_ms = soak_time_map[material] %}
        {% elif bed_soak_temp >= 100 %}
            {% set soak_ms = 300000 %}   # 5 minutes for unknown high-temp materials
        {% elif bed_soak_temp >= 85 %}
            {% set soak_ms = 240000 %}   # 4 minutes for unknown warm engineering materials
        {% elif bed_soak_temp >= 70 %}
            {% set soak_ms = 150000 %}   # 2.5 minutes for unknown mid-temp materials
        {% else %}
            {% set soak_ms = 120000 %}   # 2 minutes (default)
        {% endif %}

        # Reinforced CF/GF blends usually benefit from a little extra plate/chamber preheat.
        {% if is_abrasive and material not in ["PLA", "TPU", "PVA"] %}
            {% set soak_ms = soak_ms + 30000 %}
        {% endif %}
        
        # Wait for the resolved soak temperature to stabilize first
        M117 Stabilizing bed at {bed_soak_temp}°C...
        RESPOND TYPE=command MSG="Stabilizing bed at {bed_soak_temp}°C (waiting until >= {bed_soak_temp - 0.5}°C, abrasive={is_abrasive})"
        
        # Wait for the bed to reach the soak target floor.
        # Using only MINIMUM avoids long stalls from normal PID overshoot above target.
        TEMPERATURE_WAIT SENSOR="heater_bed" MINIMUM={bed_soak_temp - 0.5}
        
        # Convert to minutes for display
        {% set soak_minutes = (soak_ms / 60000)|round(1) %}
        
        # Display status and wait
        M117 Soaking bed: {soak_minutes}min ({raw_material})
        RESPOND TYPE=command MSG="Bed soaking for {soak_minutes} minutes ({raw_material})"
        G4 P{soak_ms}
        
        M117 Soak complete
        RESPOND TYPE=command MSG="Bed soak complete"
        
    {% else %}
        # Skip the soak
        M117 Skipping bed soak - not required
        RESPOND TYPE=command MSG="Skipping bed soak - not required for {raw_material} at {bed_soak_temp}°C"
    {% endif %}