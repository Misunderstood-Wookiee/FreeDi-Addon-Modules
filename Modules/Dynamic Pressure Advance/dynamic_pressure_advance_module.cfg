# ============================================================
# Module: Dynamic Pressure Advance
# Macro: DYNAMIC_PRESSURE_ADVANCE
# Author: MoistDreams + AI Assistant
# Version: 1.5.3
# Last Updated: 2026-08-09
# Description:
#   This macro implements a dynamic pressure advance routine for 3D printing.
#   It selects the appropriate pressure advance value based on slicer input,
#   material type, and nozzle diameter. If a slicer-provided value is present,
#   it will be used unless the FORCE_PA parameter is set to True, in which case
#   the material default will be applied. The macro also applies nozzle scaling
#   to the default pressure advance value to account for different nozzle sizes.
#   Invalid slicer values (<= 0.005 or > 0.5) are handled gracefully with
#   action_respond_info and replaced with a material-aware fallback.
#
# Expected Params which should be passed from slicer or manually:
#   PRESSURE_ADVANCE=<float>  Optional slicer-provided PA value
#   MATERIAL=<string>         Material profile name (e.g., PLA, PETG-CF, PA12-CF)
#   NOZZLE=<float>            Nozzle diameter in mm (default 0.4)
#   FORCE_PA=<bool-string>    True/False, force module defaults over slicer
#   SMOOTH_TIME=<float>       Pressure advance smoothing (default 0.040)
#
# Developer Notes:
#   - Preserve parameter precedence: slicer value wins unless FORCE_PA=True.
#   - Material matching intentionally supports substring variants.
#   - Do not hard-fail on bad PA input; warn and fallback to material defaults.
#   - Keep final PA in a strict safe range of > 0 and <= 0.5.
# ============================================================

[gcode_macro DYNAMIC_PRESSURE_ADVANCE]
description: Dynamic pressure advance with slicer override and material defaults
gcode:
    # ----- GET PARAMETERS -----
    # Slicer inputs arrive as strings; normalize before calculations.
    {% set slicer_pa = params.PRESSURE_ADVANCE|default(None) %}
    {% set slicer_pa_raw = params.PRESSURE_ADVANCE|default("")|string|trim %}
    {% set material = params.MATERIAL|default("PLA")|upper %}
    {% set nozzle_diam = params.NOZZLE|default(0.4)|float %}
    {% set force_pa = params.FORCE_PA|default("False")|lower == "true" %}
    {% set smooth_time = params.SMOOTH_TIME|default(0.04)|float %}
    {% set pa_min = 0.005 %}
    {% set pa_recommended_max = 0.25 %}
    {% set pa_hard_max = 0.5 %}
    
    # ----- NORMALIZE MATERIAL NAME -----
    {% if "PPA" in material %}
        {% set base_material = "PPA" %}
    {% elif "PAHT" in material %}
        {% set base_material = "PAHT" %}
    {% elif "PA12" in material %}
        {% set base_material = "PA12" %}
    {% elif "PA11" in material %}
        {% set base_material = "PA11" %}
    {% elif "PA6" in material or "PA66" in material %}
        {% set base_material = "PA6" %}
    {% elif "POLYCARBONATE" in material or material == "PC" or "PC-" in material or "PC/" in material or "PC+" in material or "PC " in material %}
        {% set base_material = "POLYCARBONATE" %}
    {% elif "PCTG" in material %}
        {% set base_material = "PCTG" %}
    {% elif "PETG" in material %}
        {% set base_material = "PETG" %}
    {% elif material == "PET" or "PET-" in material or "PET " in material %}
        {% set base_material = "PET" %}
    {% elif material == "PP" or "PP-" in material or material.startswith("PP ") or material.startswith("PP+") %}
        {% set base_material = "PP" %}
    {% elif "PPS" in material %}
        {% set base_material = "PPS" %}
    {% elif "PA-CF" in material or "PA/GF" in material or "PA-GF" in material or " ULTRAPA" in material or material.startswith("ULTRAPA") or "COPA" in material %}
        {% set base_material = "NYLON" %}
    {% elif "NYLON" in material or "POLYAMIDE" in material or material.startswith("PA ") or material == "PA" or material.startswith("PA-") or material.startswith("PA/") %}
        {% set base_material = "NYLON" %}
    {% elif "PEBA" in material or "PEBAX" in material %}
        {% set base_material = "PEBA" %}
    {% elif "TPU AIR" in material or "TPU-AIR" in material or "LW-TPU" in material or "LIGHTWEIGHT TPU" in material or "FOAMING TPU" in material or "TPU-AERO" in material or "AERO TPU" in material or "TPU FOAMY" in material or "FOAMY TPU" in material %}
        {% set base_material = "TPU_AIR" %}
    {% elif "SUPPORT FOR PLA-PETG" in material or "SUPPORT FOR PLA/PETG" in material %}
        {% set base_material = "PETG" %}
    {% elif "SUPPORT FOR PA PET" in material or "SUPPORT FOR PET-PA" in material or "SUPPORT FOR PET/PA" in material %}
        {% set base_material = "NYLON" %}
    {% elif "PLA" in material %}
        {% set base_material = "PLA" %}
    {% elif "ABS" in material %}
        {% set base_material = "ABS" %}
    {% elif "ASA" in material %}
        {% set base_material = "ASA" %}
    {% elif "TPU" in material or "TPE" in material %}
        {% set base_material = "TPU" %}
    {% elif "PVA" in material %}
        {% set base_material = "PVA" %}
    {% elif "HIPS" in material %}
        {% set base_material = "HIPS" %}
    {% else %}
        {% set base_material = "GENERIC" %}
    {% endif %}
    
    # ----- MATERIAL DEFAULTS (TUNE THESE FOR YOUR PRINTER) -----
    # Central map keeps defaults easy to review and update.
    {% set default_pa_map = {
        "PLA": 0.042,
        "PETG": 0.086,
        "PCTG": 0.086,
        "PET": 0.082,
        "ABS": 0.035,
        "ASA": 0.035,
        "TPU": 0.150,
        "TPU_AIR": 0.150,
        "PEBA": 0.130,
        "NYLON": 0.100,
        "PA6": 0.100,
        "PA11": 0.100,
        "PA12": 0.100,
        "PAHT": 0.100,
        "PPA": 0.100,
        "PPS": 0.090,
        "POLYCARBONATE": 0.082,
        "PP": 0.060,
        "PVA": 0.035,
        "HIPS": 0.035,
        "GENERIC": 0.035
    } %}
    {% set default_pa = default_pa_map[base_material] if base_material in default_pa_map else default_pa_map["GENERIC"] %}
    
    # ----- NOZZLE DIAMETER ADJUSTMENT -----
    {% if nozzle_diam >= 0.8 %}
        {% set nozzle_factor = 0.6 %}
    {% elif nozzle_diam >= 0.6 %}
        {% set nozzle_factor = 0.8 %}
    {% elif nozzle_diam <= 0.2 %}
        {% set nozzle_factor = 1.5 %}
    {% else %}
        {% set nozzle_factor = 1.0 %}
    {% endif %}
    
    {% set adjusted_default = default_pa * nozzle_factor %}

    # Material-aware fallback used whenever slicer PA is invalid.
    # Emergency fallback to 0.042 only if tuned material defaults are out of range.
    {% set fallback_pa = adjusted_default %}
    {% if fallback_pa <= pa_min or fallback_pa > pa_hard_max %}
        {% set fallback_pa = 0.042 %}
    {% endif %}
    
    # ----- CHOOSE FINAL PA VALUE -----
    # Presence check is explicit so empty slicer values do not override defaults.
    {% set has_slicer_value = slicer_pa is not none and slicer_pa_raw != "" %}
    
    {% if has_slicer_value and not force_pa %}
        {% set slicer_pa_value = slicer_pa|float %}
        {% if slicer_pa_value > pa_min and slicer_pa_value <= pa_hard_max %}
            {% set final_pa = slicer_pa_value %}
            {% set source = "slicer" %}
            {% if slicer_pa_value > pa_recommended_max %}
                { action_respond_info("High PRESSURE_ADVANCE from slicer: " ~ slicer_pa_raw ~ ". This is above common direct-drive ranges; consider re-tuning if artifacts appear.") }
            {% endif %}
        {% else %}
            {% set final_pa = fallback_pa %}
            {% set source = "safe fallback" %}
            {% if slicer_pa_value <= pa_min %}
                { action_respond_info("Invalid PRESSURE_ADVANCE from slicer: " ~ slicer_pa_raw ~ ". Using material fallback " ~ ("%.3f" % fallback_pa)) }
            {% else %}
                { action_respond_info("PRESSURE_ADVANCE too high from slicer: " ~ slicer_pa_raw ~ ". Using material fallback " ~ ("%.3f" % fallback_pa)) }
            {% endif %}
        {% endif %}
    {% else %}
        {% set final_pa = adjusted_default %}
        {% set source = "material default" %}
        {% if force_pa %}
            {% set source = source ~ " forced" %}
        {% endif %}
        {% if nozzle_factor != 1.0 %}
            {% set source = source ~ " nozzle: " ~ nozzle_diam|string %}
        {% endif %}
    {% endif %}
    
    # ----- SAFETY CHECKS -----
    # Any out-of-range computed value is replaced with material-aware fallback.
    {% if final_pa <= pa_min or final_pa > pa_hard_max %}
        { action_respond_info("Calculated pressure advance out of range: " ~ final_pa|string ~ ". Using material fallback " ~ ("%.3f" % fallback_pa)) }
        {% set final_pa = fallback_pa %}
        {% set source = "safe fallback" %}
    {% endif %}

    # Keep smooth time in a safe range.
    {% if smooth_time <= 0 %}
        {% set smooth_time = 0.04 %}
    {% elif smooth_time < 0.02 %}
        {% set smooth_time = 0.02 %}
    {% elif smooth_time > 0.2 %}
        {% set smooth_time = 0.2 %}
    {% endif %}
    
    # ----- FORMAT EVERYTHING FIRST -----
    # Pre-formatting avoids repeated float conversion in UI and logs.
    {% set pa_formatted = "%.3f" % final_pa %}
    {% set smooth_formatted = "%.3f" % smooth_time %}
    {% set screen_msg = "PA: " ~ pa_formatted ~ " " ~ source %}
    
    # ----- SEND CONSOLE MESSAGES (USE action_respond_info WITH QUOTES) -----
    {% if has_slicer_value and not force_pa and source == "slicer" %}
        { action_respond_info("Using PA from slicer: " ~ pa_formatted) }
    {% elif has_slicer_value and force_pa %}
        { action_respond_info("FORCE: ignoring slicer, using: " ~ pa_formatted) }
    {% else %}
        { action_respond_info("No slicer PA, using default: " ~ pa_formatted) }
    {% endif %}
    
    { action_respond_info("Pressure Advance set to: " ~ pa_formatted ~ " source: " ~ source) }
    
    # ----- APPLY PRESSURE ADVANCE (BUILT-IN COMMAND) -----
    # Keep display and applied value in sync by reusing pa_formatted.
    M117 {screen_msg}
    SET_PRESSURE_ADVANCE ADVANCE={pa_formatted} SMOOTH_TIME={smooth_formatted}

[gcode_macro ADAPTIVE_PRESSURE_ADVANCE]
description: Compatibility wrapper for DYNAMIC_PRESSURE_ADVANCE
gcode:
    DYNAMIC_PRESSURE_ADVANCE {rawparams}