# ============================================================
# Module: Adaptive Line Purge
# Macro: LINE_PURGE
# Author: MoistDreams + AI Assistant
# Version: 1.4
# Last Updated: 2026-09-19
# Based On:
#   Modified from KAMP Line_Purge.cfg
#   Original by kyleisah (Klipper-Adaptive-Meshing-Purging) - GPLv3
# Description:
#   This macro performs an adaptive purge line near the actual print area
#   using exclude_object polygon data when available.
#   It chooses a safe purge direction based on available bed space, restores
#   printer gcode state after completion, and supports an optional zig-zag
#   purge pattern while keeping a straight-line purge as the default.
#   When firmware_retraction is not configured, it falls back to a manual
#   retract/unretract move whose distance is nozzle-diameter aware (and
#   user-overridable).
#
# Expected Context:
#   - exclude_object should be enabled in slicer output for best placement.
#   - extruder.max_extrude_cross_section should be >= 5 for purge execution.
#
# Optional Context:
#   - firmware_retraction enables use of G10/G11 for retract/unretract.
#   - variable_verbose_enable controls extra status messages.
#
# Configurable Variables:
#   variable_purge_height         Z position of nozzle during purge
#   variable_tip_distance         Tip distance before purge (matches print-end retract)
#   variable_purge_margin         Distance in front/side of print area
#   variable_purge_amount         Filament amount to purge in mm
#   variable_flow_rate            Purge flow in mm3/s
#   variable_purge_pattern        Purge path style: "straight" or "zigzag"
#   variable_purge_wave_amplitude Zig-zag amplitude in mm for wave-like purge paths
#   variable_purge_wave_spacing   Zig-zag spacing in mm between wave points
#   variable_fallback_retract_dist Retract/unretract distance (mm) used when firmware_retraction
#                                  is not defined. Set to -1 to auto-scale from nozzle diameter,
#                                  or set a fixed value to override.
#   variable_verbose_enable        1 to emit extra RESPOND status messages, 0 to stay quiet.
#
# Developer Notes:
#   - Keep object-aware origin logic unchanged for placement safety.
#   - Preserve SAVE_GCODE_STATE and RESTORE_GCODE_STATE pairing.
#   - Avoid increasing default purge aggressiveness without validation.
# ============================================================

[gcode_macro LINE_PURGE]
description: Adaptive purge line placed near the printed object area
variable_purge_height: 0.8                  # Z position of nozzle during purge, default is 0.8.
variable_tip_distance: -4.0                 # Distance between tip of filament and nozzle before purge. Should be similar to PRINT_END final retract amount.
variable_purge_margin: 15                   # Distance the purge will be in front of the print area, default is 10.
variable_purge_amount: 50                   # Amount of filament to be purged prior to printing.
variable_flow_rate: 15                      # Flow rate of purge in mm3/s. Default is 12.
variable_purge_pattern: "straight"          # Purge path style: "straight" or "zigzag".
variable_purge_wave_amplitude: 0.6          # Zig-zag amplitude in mm when purge_pattern is "zigzag". Higher values make the path swing farther from the centerline.
variable_purge_wave_spacing: 1.0            # Zig-zag spacing in mm between wave points. Smaller values make the path look smoother; larger values make it more angular.
                                            # Example visible zig-zag: variable_purge_wave_amplitude: 3.0 / variable_purge_wave_spacing: 1.0
                                            # Example Prusa Core One style: variable_purge_wave_amplitude: 0.6 / variable_purge_wave_spacing: 0.5
variable_fallback_retract_dist: -1          # Retract/unretract distance in mm used only when firmware_retraction is not defined. -1 auto-scales from nozzle diameter (~1.25x nozzle diameter); set a fixed value (e.g. 0.5) to override. Hard capped at 1.2mm.
variable_verbose_enable: 0                  # 1=emit extra RESPOND status messages about the purge, 0=stay quiet. Default is 0.

    # Notes:
    # - If your purge line is too thin, raise `variable_flow_rate` or `variable_purge_amount`.
    # - If your nozzle hits the bed, increase `variable_purge_height` slightly.
    # - If the purge line is too close to the print, increase `variable_purge_margin`.

# ============================================================
# Purge G-code Logic
# ============================================================
gcode:
    # ----- Retrieve Macro Variables -----
    {% set purge_height = printer["gcode_macro LINE_PURGE"].purge_height %}
    {% set tip_distance = printer["gcode_macro LINE_PURGE"].tip_distance %}
    {% set purge_margin = printer["gcode_macro LINE_PURGE"].purge_margin %}
    {% set purge_amount = printer["gcode_macro LINE_PURGE"].purge_amount %}
    {% set flow_rate = printer["gcode_macro LINE_PURGE"].flow_rate %}
    {% set purge_pattern = printer["gcode_macro LINE_PURGE"].purge_pattern %}
    {% set purge_wave_amplitude = printer["gcode_macro LINE_PURGE"].purge_wave_amplitude %}
    {% set purge_wave_spacing = printer["gcode_macro LINE_PURGE"].purge_wave_spacing %}
    {% set fallback_retract_dist = printer["gcode_macro LINE_PURGE"].fallback_retract_dist %}
    {% set verbose_enabled = printer["gcode_macro LINE_PURGE"].verbose_enable | int %}

    # ----- Get relevant printer params -----
    {% set travel_speed = (printer.toolhead.max_velocity | default(0) | float) * 60.0 %}
    {% set cross_section = (printer.configfile.settings.extruder.max_extrude_cross_section | default(0) | float) %}
    {% set bed_min_x = (printer.toolhead.axis_minimum.x | default(0) | float) %}
    {% set bed_max_x = (printer.toolhead.axis_maximum.x | default(200) | float) %}
    {% set bed_min_y = (printer.toolhead.axis_minimum.y | default(0) | float) %}
    {% set bed_max_y = (printer.toolhead.axis_maximum.y | default(200) | float) %}
    {% set nozzle_diameter = (printer.configfile.settings.extruder.nozzle_diameter | default(0.4) | float) %}

    # Fallback retract distance when firmware_retraction is unavailable; -1 scales with nozzle diameter (0.4mm nozzle -> 0.5mm retract), hard capped at 1.2mm
    {% set fallback_retract_dist = fallback_retract_dist | float %}
    {% if fallback_retract_dist == -1 %}
        {% set fallback_retract_amount = (nozzle_diameter * 1.25) | float %}
    {% elif fallback_retract_dist < 0 %}
        {action_respond_info("[Purge] 'fallback_retract_dist' is set to %.2f, which is invalid because retract distances cannot be negative (other than -1 for auto). Fix: set variable_fallback_retract_dist to -1 for automatic nozzle-based scaling, or to a value >= 0. Using auto nozzle-based value instead."|format(fallback_retract_dist))}
        {% set fallback_retract_amount = (nozzle_diameter * 1.25) | float %}
    {% else %}
        {% set fallback_retract_amount = fallback_retract_dist %}
    {% endif %}
    {% if fallback_retract_amount > 1.2 %}
        {action_respond_info("[Purge] fallback retract distance of %.2fmm exceeds the 1.2mm safety limit, which risks grinding filament or skipping steps in the extruder. Fix: lower variable_fallback_retract_dist below 1.2mm, or leave it at -1 for automatic nozzle-based scaling. Using 0.5mm instead."|format(fallback_retract_amount))}
        {% set fallback_retract_amount = 0.5 %}
    {% endif %}

    # Use firmware retraction if it is defined
    {% if printer.firmware_retraction is defined %}
        {% set RETRACT = G10 | string %}
        {% set UNRETRACT = G11 | string %}
    {% else %}
        {% set RETRACT = ('G1 E-%.4f F2100' | format(fallback_retract_amount)) | string %}
        {% set UNRETRACT = ('G1 E%.4f F2100' | format(fallback_retract_amount)) | string %}
    {% endif %}
    
    # Calculate purge origins and centers from objects
    {% set object_points = [] %}
    {% if printer.exclude_object is defined and printer.exclude_object.objects is defined %}
        {% set object_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
    {% endif %}
    {% set purge_x_min = (object_points | map(attribute=0) | min | default(0)) %}                          # Object x min
    {% set purge_x_max = (object_points | map(attribute=0) | max | default(0)) %}                          # Object x max
    {% set purge_y_min = (object_points | map(attribute=1) | min | default(0)) %}                          # Object y min
    {% set purge_y_max = (object_points | map(attribute=1) | max | default(0)) %}                          # Object y max

    {% set purge_x_center = (((purge_x_max + purge_x_min) / 2.0) - (purge_amount / 2.0)) | float %}      # Create center point of purge line relative to print on X axis
    {% set purge_y_center = (((purge_y_max + purge_y_min) / 2.0) - (purge_amount / 2.0)) | float %}      # Create center point of purge line relative to print on Y axis

    {% set purge_x_origin = (purge_x_min - purge_margin) | float %}                                        # Add margin to x min
    {% set purge_y_origin = (purge_y_min - purge_margin) | float %}                                        # Add margin to y min

    {% set purge_x_center = ([purge_x_center, bed_min_x] | max) %}
    {% set purge_y_center = ([purge_y_center, bed_min_y] | max) %}
    {% set purge_x_origin = ([purge_x_origin, bed_min_x] | max) %}
    {% set purge_y_origin = ([purge_y_origin, bed_min_y] | max) %}

    # If there are no objects in `exclude_object`, the defaults above keep the purge near the origin.

    # Calculate purge speed
    {% set purge_move_speed = ((flow_rate / 5.0) * 60.0) | float %}

    {% if cross_section < 5 %}

        {action_respond_info("[Extruder] max_extrude_cross_section is insufficient for purge, please set it to 5 or greater. Purge skipped.")}

    {% else %}

    {% if verbose_enabled %}
        # Optional status message if verbosity is enabled
        {action_respond_info("[Purge] Moving filament tip {}mms".format(                                                                 
        (tip_distance),                                                                                      
        )) }

        {% if printer.firmware_retraction is defined %}
        {action_respond_info("Adaptive purge is using firmware retraction.")}
        {% else %}
        {action_respond_info("Adaptive purge is not using firmware retraction, it is recommended to configure it.")}
        {% endif %}

    {% endif %}

        # Choose purge direction based on available space
        {% if purge_y_origin > 0 %}
            {% set purge_x_start = ([purge_x_center, bed_min_x] | max) %}
            {% set purge_x_end = ([purge_x_start + purge_amount, bed_max_x] | min) %}
            {% set purge_line_length = ([purge_x_end - purge_x_start, 0] | max) %}
            {% set purge_y_position = ([purge_y_origin, bed_min_y] | max) %}
        {% else %}
            {% set purge_y_start = ([purge_y_center, bed_min_y] | max) %}
            {% set purge_y_end = ([purge_y_start + purge_amount, bed_max_y] | min) %}
            {% set purge_line_length = ([purge_y_end - purge_y_start, 0] | max) %}
            {% set purge_x_position = ([purge_x_origin, bed_min_x] | max) %}
        {% endif %}

        {% if purge_y_origin > 0 %}
            {action_respond_info("Adaptive purge starting at {}, {} and purging {}mm of filament, requested flow rate is {}mm3/s.".format(                                                                 
                (purge_x_center),
                (purge_y_origin),
                (purge_amount),
                (flow_rate),
            )) }
        {% else %}
            {action_respond_info("Adaptive purge starting at {}, {} and purging {}mm of filament, requested flow rate is {}mm3/s.".format(                                                                 
                (purge_x_origin),
                (purge_y_center),
                (purge_amount),
                (flow_rate),
            )) }
        {% endif %}

        {% if purge_line_length <= 0 %}
            {action_respond_info("[Purge] No safe purge line space remains on the bed, purge skipped.")}
        {% else %}
            SAVE_GCODE_STATE NAME=Prepurge_State                                                    # Save current gcode state (positioning, extrusion mode, etc.)

            {% if purge_y_origin > 0 %}                                                             # If there's room on Y, purge along X axis in front of print area

                G92 E0                                                                              # Reset extruder
                G0 F{travel_speed}                                                                  # Set travel speed
                G90                                                                                 # Absolute positioning
                G0 X{purge_x_start} Y{purge_y_position}                                             # Move to purge position
                G0 Z{purge_height}                                                                  # Move to purge Z height
                M83                                                                                 # Relative extrusion mode
                G1 E{tip_distance} F{purge_move_speed}                                              # Move filament tip
                {% if purge_pattern == "zigzag" and purge_wave_amplitude > 0 %}
                    {% set safe_wave_spacing = ([purge_wave_spacing | float, 0.25] | max) %}
                    {% set wave_step_count = (((purge_line_length / (safe_wave_spacing * 2.0)) | round(0, 'floor')) | int) %}
                    {% set wave_step_count = ([wave_step_count, 6] | max) %}
                    {% set wave_step_length = (purge_line_length / wave_step_count) | float %}
                    {% set wave_segment_extrusion = ([wave_step_length * 1.1, 0.5] | max) | float %}
                    {% for i in range(wave_step_count) %}
                        {% set wave_x = (purge_x_start + ((i + 1) * wave_step_length)) %}
                        {% set wave_y = (purge_y_position + (purge_wave_amplitude if (i % 2) == 0 else -purge_wave_amplitude)) %}
                        G1 X{wave_x} Y{wave_y} E{wave_segment_extrusion} F{purge_move_speed}
                    {% endfor %}
                {% else %}
                    G1 X{purge_x_end} E{purge_line_length} F{purge_move_speed}                      # Purge line
                {% endif %}
                {RETRACT}                                                                           # Retract
                G0 X{purge_x_end + 10} F{travel_speed}                                              # Rapid move to break string
                G92 E0                                                                              # Reset extruder distance
                M82                                                                                 # Absolute extrusion mode
                G0 Z{purge_height * 2} F{travel_speed}                                              # Z hop

            {% else %}                                                                              # If there's room on X, purge along Y axis to the left of print area
                
                G92 E0                                                                              # Reset extruder
                G0 F{travel_speed}                                                                  # Set travel speed
                G90                                                                                 # Absolute positioning
                G0 X{purge_x_position} Y{purge_y_start}                                             # Move to purge position
                G0 Z{purge_height}                                                                  # Move to purge Z height
                M83                                                                                 # Relative extrusion mode
                G1 E{tip_distance} F{purge_move_speed}                                              # Move filament tip
                {% if purge_pattern == "zigzag" and purge_wave_amplitude > 0 %}
                    {% set safe_wave_spacing = ([purge_wave_spacing | float, 0.25] | max) %}
                    {% set wave_step_count = (((purge_line_length / (safe_wave_spacing * 2.0)) | round(0, 'floor')) | int) %}
                    {% set wave_step_count = ([wave_step_count, 6] | max) %}
                    {% set wave_step_length = (purge_line_length / wave_step_count) | float %}
                    {% set wave_segment_extrusion = ([wave_step_length * 1.1, 0.5] | max) | float %}
                    {% for i in range(wave_step_count) %}
                        {% set wave_y = (purge_y_start + ((i + 1) * wave_step_length)) %}
                        {% set wave_x = (purge_x_position + (purge_wave_amplitude if (i % 2) == 0 else -purge_wave_amplitude)) %}
                        G1 X{wave_x} Y{wave_y} E{wave_segment_extrusion} F{purge_move_speed}
                    {% endfor %}
                {% else %}
                    G1 Y{purge_y_end} E{purge_line_length} F{purge_move_speed}                      # Purge line
                {% endif %}
                {RETRACT}                                                                           # Retract
                G0 Y{purge_y_end + 10} F{travel_speed}                                              # Rapid move to break string
                G92 E0                                                                              # Reset extruder distance
                M82                                                                                 # Absolute extrusion mode
                G0 Z{purge_height * 2} F{travel_speed}                                              # Z hop

            {% endif %}

            RESTORE_GCODE_STATE NAME=Prepurge_State                                                 # Restore gcode state
        {% endif %}
    
    {% endif %}
# ============================================================
# End of Macro
# ============================================================