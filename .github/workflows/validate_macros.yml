name: Validate Klipper Macros

on:
  push:
  pull_request:
  merge:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Validate macro syntax
        run: |
          if grep -R "syntax error" Modules/*/*.cfg; then
            echo "Syntax errors found"
            exit 1
          fi
          echo "Macros validated successfully"